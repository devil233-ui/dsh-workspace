# dsh-workspace bundle patch：只把本插件插入 profile 的 layer stack。
#
# 注意：insert 的 name 是 Node 模块说明符（= profile 依赖键 = node_modules 目录名），
# 必须与 package.json 的 name 完全一致；对不上时宿主 import 失败（DSH 启动只告警，客户端 UI 会静默消失）。
#
# 不依赖 dsh-better-sidebar：右侧栏标签由 lib/client.js 直接注册到宿主原生右栏
# （sidebarRightTabs 服务 + sidebar.right.pane.tab 插槽），等服务就绪后再注册；
# better-sidebar 只做检测，可在「远程工作区 → 侧边栏」页签一键禁用 / 重新启用。
- insert:
    - id: dsh-workspace
      name: '@yh4922/dsh-workspace'
